version: 2

project_name: kaizen-mangal

before:
  hooks:
    - go mod verify

builds:
  - id: kaizen-mangal
    binary: kaizen-mangal
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X 'github.com/kaizen-architecture/kaizen-mangal/constant.Version={{ .Version }}'
      - -X 'github.com/kaizen-architecture/kaizen-mangal/constant.BuiltAt={{ .Date }}'
      - -X 'github.com/kaizen-architecture/kaizen-mangal/constant.BuiltBy=goreleaser'
      - -X 'github.com/kaizen-architecture/kaizen-mangal/constant.Revision={{ .ShortCommit }}'

archives:
  - id: default
    name_template: "kaizen-mangal_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - completions/*
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: "New Features"
      regexp: "^.*feat(\\(.+\\))?!?:.+$"
      order: 100
    - title: "Bug Fixes"
      regexp: "^.*fix(\\(.+\\))?!?:.+$"
      order: 200
    - title: "Performance"
      regexp: "^.*perf(\\(.+\\))?!?:.+$"
      order: 300
    - title: "Documentation"
      regexp: "^.*docs(\\(.+\\))?!?:.+$"
      order: 400
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - "^test"
      - "^chore"
      - "^refactor"
      - "Merge pull request"
      - "Merge branch"

release:
  mode: append
  github:
    owner: kaizen-Architecture
    name: kaizen-mangal
  name_template: "kaizen-mangal v{{ .Version }}"
